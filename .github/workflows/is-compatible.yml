name: Latest Grafana API compatibility check
on: [pull_request]

jobs:
  compatibilitycheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm action uses the packageManager field in package.json to
      # understand which version to install.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build plugin
        run: pnpm run build

      - name: App compatibility check
        uses: grafana/plugin-actions/is-compatible@is-compatible/v1.0.3
        with:
          module: ./src/module.tsx
          comment-pr: 'no'
          fail-if-incompatible: 'yes'

      - name: Datasource compatibility check
        uses: grafana/plugin-actions/is-compatible@is-compatible/v1.0.3
        with:
          module: ./src/datasource/module.ts
          comment-pr: 'no'
          fail-if-incompatible: 'yes'
